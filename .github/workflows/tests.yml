name: Arcade checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      ARCADE_HEADLESS: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
